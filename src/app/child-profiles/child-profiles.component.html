<div class="screen">
  <div class="top">
    <header class="status">
      <span>9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 18 12" width="17" height="12" aria-hidden="true">
          <rect x="0" y="7.5" width="3" height="4.5" rx="0.6" fill="#111" />
          <rect x="4.5" y="5" width="3" height="7" rx="0.6" fill="#111" />
          <rect x="9" y="2.4" width="3" height="9.6" rx="0.6" fill="#111" />
          <rect x="13.5" y="0" width="3" height="12" rx="0.6" fill="#111" />
        </svg>
        <svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true">
          <path d="M8 10.2a1.3 1.3 0 1 0 0.01 0z" fill="#111" />
          <path d="M3.2 7.2a6.6 6.6 0 0 1 9.6 0" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round" />
          <path d="M0.8 4.6a10 10 0 0 1 14.4 0" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round" />
        </svg>
        <svg viewBox="0 0 27 13" width="25" height="12" aria-hidden="true">
          <rect x="0.6" y="0.6" width="22" height="11.8" rx="2.4" fill="none" stroke="#111" stroke-width="1.2" />
          <rect x="2" y="2" width="16" height="9" rx="1.2" fill="#111" />
          <rect x="23.6" y="4" width="2" height="5" rx="0.8" fill="#111" />
        </svg>
      </span>
    </header>

    <div class="top-row">
      <img class="mini-logo" src="assets/carenest_logo.png" alt="CareNest" />
      <a class="back" routerLink="/children" aria-label="رجوع">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M14.5 6 L8.5 12 L14.5 18" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>
  </div>

  <section class="banner">
    <h1>اختار الطفل</h1>
    <p>اختر الطفل لعرض معلوماته</p>
  </section>
    
  <div class="list">
    @for (child of children; track child.id) {
    <button type="button" class="child" [class]="child.color" (click)="goTo(child.id)">
      <div class="avatar">
        @if (child.gender === 'boy') {
        <img src="assets/boy.png" alt="ولد" />
        } @else {
        <img src="assets/girl.png" alt="بنت" />
        }
      </div>
      <div class="meta">
        <strong>{{ child.name }}</strong>
        <span>{{ child.age }} {{ ageWord(child.age) }}</span>
      </div>
    </button>
    }
  </div>

  <button type="button" class="primary add" routerLink="/children/add">
    <span>اضافة طفل</span>
    <span class="plus">+</span>
  </button>

  <div class="home-bar"></div>
</div>
