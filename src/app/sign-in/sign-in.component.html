<div class="screen signin">
  <header class="status">
    <span>9:41</span>
    <span class="status-icons">
      <svg viewBox="0 0 18 12" width="17" height="12" aria-hidden="true">
        <rect x="0" y="7.5" width="3" height="4.5" rx="0.6" fill="#111" />
        <rect x="4.5" y="5" width="3" height="7" rx="0.6" fill="#111" />
        <rect x="9" y="2.4" width="3" height="9.6" rx="0.6" fill="#111" />
        <rect x="13.5" y="0" width="3" height="12" rx="0.6" fill="#111" />
      </svg>
      <svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true">
        <path d="M8 10.2a1.3 1.3 0 1 0 0.01 0z" fill="#111" />
        <path d="M3.2 7.2a6.6 6.6 0 0 1 9.6 0" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round" />
        <path d="M0.8 4.6a10 10 0 0 1 14.4 0" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round" />
      </svg>
      <svg viewBox="0 0 27 13" width="25" height="12" aria-hidden="true">
        <rect x="0.6" y="0.6" width="22" height="11.8" rx="2.4" fill="none" stroke="#111" stroke-width="1.2" />
        <rect x="2" y="2" width="16" height="9" rx="1.2" fill="#111" />
        <rect x="23.6" y="4" width="2" height="5" rx="0.8" fill="#111" />
      </svg>
    </span>
  </header>

  <img class="logo" src="assets/carenest_logo.png" alt="CareNest" />

  <main class="sheet">
    <h1>أهلا بعودتك!</h1>
    <p class="lead">ادخل البيانات التالية لتتمكن من الوصول إلى حسابك!</p>

    <label class="combo">
      <span>البريد الالكتروني</span>
      <input type="email" value="example@gmail.com" autocomplete="off" />
    </label>

    <label class="combo password">
      <span>كلمة المرور</span>
      <input
        [type]="showPassword ? 'text' : 'password'"
        value="12345678"
        autocomplete="off"
      />
      <button type="button" class="eye" (click)="showPassword = !showPassword" aria-label="إظهار كلمة المرور">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="#8d8d92" stroke-width="1.6" />
          <circle cx="12" cy="12" r="2.4" fill="none" stroke="#8d8d92" stroke-width="1.6" />
        </svg>
      </button>
    </label>

    <button type="button" class="forgot">هل نسيت كلمة المرور؟</button>

    <button type="button" class="primary" routerLink="/children">تسجيل الدخول!</button>

    <div class="signup-row">
      <p>ليس لديك حساب؟</p>
      <button type="button" class="signup" routerLink="/children/add">سجل الآن</button>
    </div>
  </main>

  <div class="home-bar"></div>
</div>
