<div class="screen">
  <div class="top">
    <div class="top-row">
      <img class="mini-logo" src="assets/carenest_logo.png" alt="CareNest" />
      <a class="back" routerLink="/signin" aria-label="رجوع">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M14.5 6 L8.5 12 L14.5 18" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>
  </div>

  <section class="banner">
    <h1>انشاء حساب جديد</h1>
    <p>بامكانك تعديل معلومات الطفل لاحقا</p>
  </section>

  <form class="form">
    <label class="q" for="child-name">ماهو اسم طفلك؟</label>
    <div class="text-field">
      <input id="child-name" type="text" placeholder="الاسم" autocomplete="off" />
    </div>

<label class="q" for="child-birth">تاريخ ميلاد طفلك</label>
<div class="text-field with-icon">
  <input id="child-birth" type="date" placeholder="التاريخ" autocomplete="off" />
</div>

    <p class="q">ماهو جنس طفلك؟</p>
    <div class="genders">
      <button
        type="button"
        class="gender"
        [class.selected]="gender() === 'boy'"
        [attr.aria-pressed]="gender() === 'boy'"
        (click)="gender.set('boy')"
      >
        <img src="assets/boy.png" alt="ولد" width="58" height="52" />
        <span>ولد</span>
      </button>

      <button
        type="button"
        class="gender"
        [class.selected]="gender() === 'girl'"
        [attr.aria-pressed]="gender() === 'girl'"
        (click)="gender.set('girl')"
      >
        <img src="assets/girl.png" alt="بنت" width="58" height="52" />
        <span>بنت</span>
      </button>
    </div>

    <p class="q condition">اختيار و تعديل الحالة المرضيه</p>
    <div class="text-field">
      <input type="text" autocomplete="off" aria-label="اختيار و تعديل الحالة المرضيه" />
    </div>

    <button type="button" class="primary create" routerLink="/home">انشاء</button>
  </form>
</div>
