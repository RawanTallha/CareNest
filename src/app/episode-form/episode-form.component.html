<div class="screen">
  <header class="page-header">
    <div class="page-header-row">
      <div class="page-title">
        <img src="assets/report.png" alt="" />
        <h1>تفاصيل النوبة</h1>
      </div>
      <a class="back" routerLink="/episodes" aria-label="رجوع">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M14.5 6 L8.5 12 L14.5 18" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>
  </header>

  <form class="form" (submit)="$event.preventDefault(); save()">
    <label class="label first" for="ep-type">نوع النوبة</label>
    <input id="ep-type" class="field compact" type="text" autocomplete="off" />

    <div class="trio">
      <div>
        <label class="label" for="ep-duration">المدة</label>
        <input id="ep-duration" class="field small" type="text" autocomplete="off" />
      </div>
      <div>
        <label class="label" for="ep-time">الوقت</label>
        <input id="ep-time" class="field small" type="text" autocomplete="off" />
      </div>
      <div>
        <label class="label" for="ep-date">التاريخ</label>
        <input id="ep-date" class="field small" type="text" autocomplete="off" />
      </div>
    </div>

    <label class="label" for="ep-onset">كيف بدات؟</label>
    <input id="ep-onset" class="field" type="text" autocomplete="off" />

    <label class="label" for="ep-early">تحديد الاعراض المبكرة</label>
    <input id="ep-early" class="field" type="text" autocomplete="off" />

    <label class="label" for="ep-during">ماذا حدث اثناء النوبة؟</label>
    <input id="ep-during" class="field" type="text" autocomplete="off" />

    <label class="label" for="ep-handling">كيف تم التعامل معها؟</label>
    <input id="ep-handling" class="field" type="text" autocomplete="off" />

    <p class="label">هل تم تفعيل خطة الطوارئ؟</p>
    <div class="yes-no">
      <button type="button" class="field" [class.selected]="answers.emergencyPlan === 'yes'" [attr.aria-pressed]="answers.emergencyPlan === 'yes'" (click)="answer('emergencyPlan', 'yes')">نعم</button>
      <button type="button" class="field" [class.selected]="answers.emergencyPlan === 'no'" [attr.aria-pressed]="answers.emergencyPlan === 'no'" (click)="answer('emergencyPlan', 'no')">لا</button>
    </div>

    <label class="label" for="ep-medication">هل تم اعطاء اي ادوية؟</label>
    <input id="ep-medication" class="field" type="text" autocomplete="off" />

    <label class="label" for="ep-state">ماهي حالة الطفل الان؟</label>
    <input id="ep-state" class="field" type="text" autocomplete="off" />

    <p class="label">هل تم استخدام البخاخ الاسعافي؟</p>
    <div class="yes-no">
      <button type="button" class="field" [class.selected]="answers.inhalerUsed === 'yes'" [attr.aria-pressed]="answers.inhalerUsed === 'yes'" (click)="answer('inhalerUsed', 'yes')">نعم</button>
      <button type="button" class="field" [class.selected]="answers.inhalerUsed === 'no'" [attr.aria-pressed]="answers.inhalerUsed === 'no'" (click)="answer('inhalerUsed', 'no')">لا</button>
    </div>

    <label class="label" for="ep-dose">النوع و الجرعة؟</label>
    <input id="ep-dose" class="field" type="text" autocomplete="off" />

    <p class="label">هل كررت الجرعة؟</p>
    <div class="yes-no">
      <button type="button" class="field" [class.selected]="answers.doseRepeated === 'yes'" [attr.aria-pressed]="answers.doseRepeated === 'yes'" (click)="answer('doseRepeated', 'yes')">نعم</button>
      <button type="button" class="field" [class.selected]="answers.doseRepeated === 'no'" [attr.aria-pressed]="answers.doseRepeated === 'no'" (click)="answer('doseRepeated', 'no')">لا</button>
    </div>

    <p class="label">هل تم التوجه الى الطوارئ؟</p>
    <div class="yes-no">
      <button type="button" class="field" [class.selected]="answers.wentToER === 'yes'" [attr.aria-pressed]="answers.wentToER === 'yes'" (click)="answer('wentToER', 'yes')">نعم</button>
      <button type="button" class="field" [class.selected]="answers.wentToER === 'no'" [attr.aria-pressed]="answers.wentToER === 'no'" (click)="answer('wentToER', 'no')">لا</button>
    </div>

    <button type="submit" class="save">حفظ</button>
  </form>

  <nav class="bottom-nav" aria-label="التنقل">
    <a class="nav-item" routerLink="/account" aria-label="الحساب">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle cx="12" cy="7.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.4" />
        <path d="M4.8 20.5c.3-4 3.2-6.6 7.2-6.6s6.9 2.6 7.2 6.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </svg>
    </a>
    <a class="nav-item" routerLink="/reports" aria-label="التقارير">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M10.5 5.5A7.5 7.5 0 1 0 18 13h-7.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
        <path d="M13.5 3a7.5 7.5 0 0 1 7.5 7.5h-7.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
      </svg>
    </a>
    <a class="nav-item active" routerLink="/home" aria-label="الرئيسية">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M4 10.4 10.6 4.6a2.1 2.1 0 0 1 2.8 0L20 10.4v8.1a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5z" fill="currentColor" />
        <path d="M12 15.6v2.2" stroke="#dfeff1" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </a>
    <a class="nav-item" routerLink="/emergency" aria-label="الطوارئ">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M6.6 3.6h2.6l1.5 4-2 1.6a13.5 13.5 0 0 0 6.1 6.1l1.6-2 4 1.5v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.8a2 2 0 0 1 2-2.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
      </svg>
    </a>
  </nav>
</div>
